name: Build

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - name: Harvey carrega (sem credenciais, só sintaxe e imports)
        run: node --check harvey/claude.ts && node -e "import('./shared/vendas.ts').then(m=>console.log('vendas ok', Object.keys(m).length))"
